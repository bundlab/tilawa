name: tilawa
description: A modern Quran recitation and audio player built with Flutter.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  google_fonts: ^6.3.2
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
